# ---- Servidor ----
server.port=${PORT:8080}

# Cargar credenciales locales desde archivo externo (no versionado).
# `optional:` = si no existe (ej. en Render), simplemente se ignora y se
# usan las env vars de abajo.
spring.config.import=optional:file:./application-secrets.yml

# ---- Datasource (env vars inyectadas por Render/Aiven) ----
spring.datasource.url=${URL_MYSQL:}
spring.datasource.username=${USER_MYSQL:}
spring.datasource.password=${PASS_MYSQL:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP: la BD puede estar dormida (Aiven free) → no bloqueamos el arranque
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Respetar los nombres explícitos de @Column (evita snake_case forzado).
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Aiven puede estar dormido al arrancar: evitamos que Hibernate lea metadata
# JDBC en el boot (arriba el pool no bloquea y as�e el health check responde
# mientras la BD despierta).
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# ---- Logging ----
logging.level.org.hibernate.SQL=WARN

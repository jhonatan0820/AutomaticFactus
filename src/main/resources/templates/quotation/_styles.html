<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<style th:fragment="styles">
    :root {
        --c-ink: #1a1f2b;
        --c-ink-soft: #4a5568;
        --c-muted: #7a8598;
        --c-line: #e4e8ef;
        --c-line-strong: #cfd6e0;
        --c-bg: #f6f7fa;
        --c-surface: #ffffff;
        --c-accent: #0f2a4a;
        --c-accent-soft: #eaf0f7;
        --radius: 6px;
        --font: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--c-bg); color: var(--c-ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }

    .page { max-width: 900px; margin: 32px auto; padding: 0 16px; }
    .quotation {
        background: var(--c-surface);
        border: 1px solid var(--c-line);
        border-radius: var(--radius);
        padding: 48px 56px;
        box-shadow: 0 1px 2px rgba(15, 42, 74, 0.04);
    }

    /* ---------- Header ---------- */
    .doc-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 24px; border-bottom: 2px solid var(--c-accent); }
    .doc-header__brand { display: flex; gap: 16px; align-items: center; }
    .doc-header__logo {
        width: 56px; height: 56px; border-radius: 8px;
        background: var(--c-accent); color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 20px; letter-spacing: 1px;
    }
    .doc-header__logo-img { width: 120px; height: 120px; object-fit: contain; border-radius: 6px; }
    .doc-header__name { font-size: 20px; margin: 0; color: var(--c-accent); font-weight: 700; }
    .doc-header__meta { margin: 4px 0 0; color: var(--c-ink-soft); font-size: 12.5px; }
    .doc-header__meta .dot { margin: 0 6px; color: var(--c-muted); }

    /* ---------- Doc title ---------- */
    .doc-title { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 28px; }
    .doc-title__eyebrow { text-transform: uppercase; letter-spacing: 2px; font-size: 11px; color: var(--c-muted); margin: 0 0 4px; }
    .doc-title__text { font-size: 28px; margin: 0; color: var(--c-accent); font-weight: 700; }
    .doc-title__meta dl { display: grid; grid-template-columns: auto auto; gap: 4px 16px; margin: 0; text-align: right; }
    .doc-title__meta dt { color: var(--c-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; }
    .doc-title__meta dd { margin: 0; color: var(--c-ink); font-weight: 600; }

    /* ---------- Parties ---------- */
    .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 28px; }
    .party { border: 1px solid var(--c-line); border-radius: var(--radius); padding: 16px 18px; background: #fafbfd; }
    .party__label { margin: 0 0 8px; font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--c-muted); font-weight: 600; }
    .party__name { margin: 0 0 4px; font-size: 15px; font-weight: 600; color: var(--c-ink); }
    .party__line { margin: 2px 0; color: var(--c-ink-soft); font-size: 13px; }

    /* ---------- Items ---------- */
    .items { margin-top: 32px; }
    .items__table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .items__table thead th {
        background: var(--c-accent);
        color: #fff;
        text-align: left;
        padding: 12px 14px;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .6px;
    }
    .items__table tbody td { padding: 14px; border-bottom: 1px solid var(--c-line); vertical-align: top; }
    .items__table tbody tr:nth-child(even) td { background: #fafbfd; }
    .col-idx { width: 40px; text-align: center; color: var(--c-muted); }
    .col-size { width: 80px; text-align: center; }
    .col-qty { width: 90px; text-align: right; }
    .col-price, .col-total { width: 140px; text-align: right; white-space: nowrap; }
    .items__table tbody td.col-total { font-weight: 600; }

    /* ---------- Totals ---------- */
    .totals { margin-top: 20px; display: flex; justify-content: flex-end; }
    .totals__box { width: 320px; }
    .totals__row { display: flex; justify-content: space-between; padding: 8px 14px; font-size: 13.5px; color: var(--c-ink-soft); }
    .totals__row--grand {
        margin-top: 6px;
        border-top: 2px solid var(--c-accent);
        padding-top: 14px;
        font-size: 16px;
        color: var(--c-accent);
        font-weight: 700;
        background: var(--c-accent-soft);
        border-radius: 0 0 var(--radius) var(--radius);
    }

    /* ---------- Terms ---------- */
    .terms { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--c-line); }
    .terms__title { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--c-muted); font-weight: 600; }
    .terms__title--spaced { margin-top: 20px; }
    .terms__list { margin: 0; padding-left: 18px; color: var(--c-ink-soft); }
    .terms__list li { margin-bottom: 4px; }
    .terms__notes { margin-top: 16px; }
    .terms__notes h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--c-muted); }

    /* ---------- Footer ---------- */
    .doc-footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--c-line); text-align: center; color: var(--c-muted); font-size: 12px; }
    .doc-footer__row .dot { margin: 0 6px; }
    .doc-footer__legal { margin: 6px 0 0; font-size: 11px; color: var(--c-muted); }

    /* Documento con layout fijo tipo A4 — no reflow en móvil.
       La preview en móvil se maneja vía <meta name="viewport" content="width=900">
       para que el navegador muestre el documento completo escalado, con pinch-zoom. */

    /* ---------- Print / PDF ---------- */
    @media print {
        @page { size: A4; margin: 0; }
        html, body { background: #fff; font-size: 11px; margin: 0; }
        .page { margin: 0; padding: 0; max-width: none; }
        .quotation { border: none; box-shadow: none; padding: 10mm 12mm; border-radius: 0; }

        .doc-header { padding-bottom: 14px; }
        .doc-header__logo-img { width: 110px; height: 110px; }
        .doc-header__name { font-size: 18px; }

        .doc-title { margin-top: 14px; }
        .doc-title__text { font-size: 22px; }

        .parties { margin-top: 14px; gap: 12px; }
        .party { padding: 10px 12px; }

        .items { margin-top: 16px; }
        .items__table { font-size: 11px; }
        .items__table thead th { padding: 8px 10px; }
        .items__table tbody td { padding: 8px 10px; }

        .totals { margin-top: 10px; }
        .totals__row { padding: 5px 12px; }
        .totals__row--grand { padding-top: 10px; font-size: 14px; }

        .terms { margin-top: 18px; padding-top: 12px; }
        .terms__title { margin: 0 0 6px; }
        .terms__title--spaced { margin-top: 12px; }
        .terms__list li { margin-bottom: 2px; }

        .doc-footer { margin-top: 18px; padding-top: 10px; font-size: 10px; }

        .items__table thead { display: table-header-group; }
        .items__table tfoot { display: table-footer-group; }
        .items__table tr, .totals__row { page-break-inside: avoid; break-inside: avoid; }
        .terms, .doc-footer { page-break-inside: avoid; break-inside: avoid; }
        .quotation { page-break-after: avoid; }
    }
</style>
</head>
<body></body>
</html>
